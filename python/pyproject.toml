[project]
name = "apiverve-initialismgenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Initialism Generator creates initialisms from phrases by extracting first letters of significant words, with options for filtering and formatting."
keywords = ["initialism generator", "acronym generator", "abbreviation", "initials", "phrase shortening"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/initialismgenerator?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/initialismgenerator?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/initialismgenerator-api"
Twitter = "https://twitter.com/apivervehq"
